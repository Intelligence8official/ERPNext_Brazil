[project]
name = "brazil_module"
version = "1.0.0"
description = "Brazil ERP - Fiscal documents (NF-e, CT-e, NFS-e) and Banking integration for ERPNext"
authors = [
    {name = "Intelligence8", email = "contact@intelligence8.com"}
]
license = {text = "MIT"}
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "cryptography>=46.0.0",
    "requests>=2.32.0",
    "pypdf>=4.0.0",
    "qrcode[pil]>=7.4.0",
    "Pillow>=10.0.0",
    "anthropic>=0.52.0",
    # The other two providers of the LLM layer. Hard dependencies on purpose:
    # the provider is switched from the desk, and a switch that needs a deploy
    # to take effect is not a switch.
    "google-genai>=2.24.0,<3.0.0",
    "openai>=3.16.0,<4.0.0",
    "python-telegram-bot>=21.0",
]

[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["brazil_module/tests"]
pythonpath = ["."]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E402"]  # Module level import not at top: required for frappe mock pattern in tests
